<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMPIRES — MixMash Studio</title>
    <meta name="description" content="EMPIRES is a browser build of a deterministic C++ real-time strategy sim: 7 civilizations, combat, and an AI opponent. Local skirmish only in the browser." />
    <link rel="canonical" href="https://mixmash.games/empires" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta name="theme-color" content="#111111" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EMPIRES" />
    <meta property="og:description" content="A deterministic C++/WebAssembly RTS: 7 civilizations, combat, and an AI opponent. Local skirmish only in the browser." />
    <meta property="og:url" content="https://mixmash.games/empires" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #111; overflow: hidden; }
      #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #2b3a1e; cursor: crosshair; }
      .back-pill {
        position: fixed; top: 14px; left: 14px; z-index: 10;
        font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
        text-transform: uppercase; text-decoration: none;
        color: #F0F0F8; background: rgba(6,6,14,0.72);
        border: 1px solid rgba(255,255,255,0.14);
        padding: 7px 14px; border-radius: 999px;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        opacity: 0.85; transition: opacity 0.2s;
      }
      .back-pill:hover { opacity: 1; }
      #status {
        position: fixed; top: 14px; right: 14px; z-index: 10;
        font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.05em;
        color: #9A9ABB; background: rgba(6,6,14,0.72);
        border: 1px solid rgba(255,255,255,0.14);
        padding: 7px 14px; border-radius: 999px;
        max-width: 60vw;
      }
      #status:empty { display: none; }

      #loading {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #111;
        font-family: 'Space Mono', monospace; color: #F0F0F8;
      }
      #loadbar-track {
        width: min(320px, 70vw); height: 8px; border-radius: 999px;
        background: rgba(255,255,255,0.12); overflow: hidden;
      }
      #loadbar-fill {
        height: 100%; width: 0%; border-radius: 999px;
        background: linear-gradient(90deg, #FF2D6B, #B429F9, #00F0FF);
        transition: width 0.15s ease-out;
      }
      #loadbar-label { font-size: 12px; letter-spacing: 0.05em; color: #9A9ABB; }

      #start-hint {
        position: fixed; left: 0; right: 0; bottom: 40px; z-index: 10;
        display: none; justify-content: center;
      }
      #start-hint button {
        font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 0.08em;
        text-transform: uppercase; color: #111; background: #39FF8E;
        border: none; border-radius: 999px; padding: 12px 28px; cursor: pointer;
        box-shadow: 0 6px 24px rgba(57,255,142,0.35);
        animation: start-pulse 1.6s ease-in-out infinite;
      }
      @keyframes start-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <a class="back-pill" href="../">&#8592; mixmash.games</a>
    <div id="status"></div>

    <div id="loading">
      <div id="loadbar-track"><div id="loadbar-fill"></div></div>
      <div id="loadbar-label">Loading EMPIRES...</div>
    </div>

    <div id="start-hint">
      <button type="button">&#9654; Click or press SPACE to start</button>
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script src="./assets/shell.js"></script>
    <script src="./assets/aoe2-clone.js"></script>
  </body>
</html>
