# Keeps admin/catalog.json (mixmash.games/admin/) in step with the tree.
#
# Work reaches gh-pages through pull requests and through direct pushes, so a
# new, removed or renamed file can land without `npm run admin:index`. After
# every push this job regenerates the catalog and, when it changed, commits it
# back and asks Pages to rebuild. Pushes made with GITHUB_TOKEN do not start
# workflows, so the sync commit cannot trigger itself.
name: Admin index sync

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

concurrency:
  group: admin-index-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the catalog
        run: node admin/build-catalog.mjs
      - name: Commit and push when it changed
        id: sync
        run: |
          if git diff --quiet -- admin/catalog.json; then
            echo "The catalog already matches the tree."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/catalog.json
          git commit -m 'Sync the admin index with the tree' -m "Regenerated by the admin-index workflow for ${GITHUB_SHA::7}."
          if git push origin HEAD:gh-pages; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            # A newer push landed first; its own run of this job syncs it.
            echo "::notice::gh-pages moved during the sync; the newer push's run will regenerate the catalog."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild Pages
        if: steps.sync.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
            || echo "::warning::The Pages build request failed; the next push to gh-pages publishes the synced catalog."
