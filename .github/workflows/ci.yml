name: CI

on:
  # Every push: the admin catalog check in npm test covers every tracked file,
  # so a path filter would let a stale catalog through to the next unrelated change.
  push:
    branches: [gh-pages]
  pull_request:
  workflow_dispatch:
    inputs:
      hosted:
        description: 'Run on GitHub-hosted ubuntu-latest instead of the self-hosted box runner (spends hosted minutes)'
        type: boolean
        default: false
      foh_performance:
        description: 'Collect a full Front of House CI calibration (at least 12 minutes)'
        type: boolean
        default: false
      foh_performance_gate:
        description: 'Run paired Front of House regression checks (about 30 minutes)'
        type: boolean
        default: false
      foh_performance_fault:
        description: 'Also prove rejection with a full 20ms CPU slowdown (about 15 additional minutes)'
        type: boolean
        default: true

# Runner routing: the test job runs on the self-hosted box runner
# (/home/box/actions-runner-mixmash, labels self-hosted/Linux/X64/mixmash).
# It falls back to GitHub-hosted ubuntu-latest only when dispatched by hand with
# hosted: true, or for pull requests from forks, which must never reach the box.
# foh-performance and foh-regression stay on hosted ubuntu-24.04 on purpose:
# performance-gate.mjs requires runnerClass ubuntu-24.04 and its limits are
# calibrated on that image, not on the shared box.
jobs:
  scope:
    # Skips the post-merge run when it would only repeat a test that already
    # passed. Either (a) the pushed commit has exactly the tree of a merged pull
    # request's head, and CI's test job passed on that head as a pull_request run
    # (the head contained the old gh-pages, so the PR's merge ref was this same
    # tree), or (b) the merge touches nothing outside front-of-house/.
    # FOH releases also bump sw.js, CHANGELOG.md and admin/catalog.json, so (b)
    # alone almost never applied. Direct pushes always run the full job.
    if: github.event_name == 'push'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.hosted) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","mixmash"]') }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Select changes that need the full job
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          run=true
          reason='direct push or untested change'
          heads=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha' 2>/dev/null || true)
          if [ -n "$heads" ]; then
            reason='merged PR, but not the exact tree its CI tested, and not front-of-house/ only'
            tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null || true)
            for head in $heads; do
              [ -n "$tree" ] || break
              [ "$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha 2>/dev/null || true)" = "$tree" ] || continue
              for id in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=20" --jq '.workflow_runs[].id' 2>/dev/null); do
                ok=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "test" and .conclusion == "success")] | length' 2>/dev/null || echo 0)
                if [ "${ok:-0}" -gt 0 ]; then
                  run=false; reason="same tree as PR head $head, tested in run $id"; break 2
                fi
              done
            done
            if [ "$run" = true ] && [ -n "${BEFORE//0/}" ]; then
              if files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename' 2>/dev/null) \
                && [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ] \
                && ! grep -qv '^front-of-house/' <<< "$files"; then
                run=false; reason='merged change touches only front-of-house/'
              fi
            fi
          fi
          echo "merged PR heads: ${heads:-none}; full job: $run ($reason)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run == 'true') }}
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.hosted) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","mixmash"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:front-of-house-vendor
      - run: npm run check:front-of-house-assets
      - run: node --test test/front-of-house-performance*.test.mjs
      - run: npm test
      - run: npm run vercel-build
      - run: npm run art:validate
      - run: npm run art:report
      - run: git diff --exit-code -- mars/art/reports/art-validation.json mars/art/reports/artist-test-approval.json mars/art/reports/golden-approval.json
      - run: npm run art:contact-sheet
      - run: git diff --exit-code -- mars/art/reports/golden-contact-sheet.html
      - run: npm run sim
      - run: npm run sim:front-of-house
      - run: git diff --exit-code -- front-of-house/docs/BALANCE_BASELINE.md
      - run: npm run sim:front-of-house-tiers
      - run: git diff --exit-code -- front-of-house/docs/TIER_BASELINE.md
      - run: npm run sim:front-of-house-career
      - run: git diff --exit-code -- front-of-house/docs/CAREER_BASELINE.md
      - run: npm run docs:front-of-house
      - run: git diff --exit-code -- front-of-house/docs/ASSETS.md front-of-house/docs/CATALOG.md front-of-house/docs/STRINGS.md
      - name: Install Playwright browsers
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            npx playwright install --with-deps chromium webkit
            exit 0
          fi
          # Box runner: install-deps.sh preinstalls the system libraries, so apt
          # (whose Debian mirror sometimes answers 500) is only used if Playwright
          # reports something missing, with retries.
          if ! npx playwright install-deps --dry-run chromium webkit | grep -q 'All system dependencies are installed'; then
            for attempt in 1 2 3; do
              npx playwright install-deps chromium webkit && break
              [ "$attempt" = 3 ] && exit 1
              sleep 30
            done
          fi
          npx playwright install chromium webkit
      # Browser smokes go through box-browser.sh: on the self-hosted box each
      # gets a private D-Bus session and they take turns across both mixmash
      # runners (see the script). On hosted runners it runs the command as is.
      - name: npm run smoke:landing
        run: .github/scripts/box-browser.sh npm run smoke:landing
      - name: npm run smoke:front-of-house
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house
      - run: node --test test/front-of-house-version.test.mjs
      - name: node test/front-of-house-menu-art-smoke.mjs
        run: .github/scripts/box-browser.sh node test/front-of-house-menu-art-smoke.mjs
      - name: npm run smoke:front-of-house-advisory
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-advisory
      - name: npm run smoke:front-of-house-suggestions
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-suggestions
      - name: npm run smoke:front-of-house-floor
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-floor
      - name: npm run smoke:front-of-house-batching
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-batching
      - name: npm run smoke:front-of-house-resolution
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-resolution
      - name: node test/front-of-house-performers-smoke.mjs
        run: .github/scripts/box-browser.sh node test/front-of-house-performers-smoke.mjs
      - name: npm run smoke:front-of-house-site-equipment
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-site-equipment
      - name: npm run smoke:front-of-house-lighting
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-lighting
      - name: npm run smoke:front-of-house-lot
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-lot
      - name: npm run smoke:front-of-house-3d
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-3d
      - name: npm run smoke:front-of-house-club
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-club
      - name: npm run smoke:front-of-house-shell
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-shell
      - name: npm run smoke:front-of-house-festival
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-festival
      - name: npm run smoke:front-of-house-navigation
        run: .github/scripts/box-browser.sh npm run smoke:front-of-house-navigation
      - name: npm run art:visual
        run: .github/scripts/box-browser.sh npm run art:visual
      - name: npm run smoke:play
        run: .github/scripts/box-browser.sh npm run smoke:play
      - name: npm run smoke:catalog
        run: .github/scripts/box-browser.sh npm run smoke:catalog
      - name: npm run smoke:zelda2mario
        run: .github/scripts/box-browser.sh npm run smoke:zelda2mario
      - name: npm run smoke:admin
        run: .github/scripts/box-browser.sh npm run smoke:admin
      - name: npm run smoke:mobile
        run: .github/scripts/box-browser.sh npm run smoke:mobile
      - name: Clean up browser and server processes left by this job (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        run: |
          # Only processes carrying this run's GITHUB_RUN_ID, so other agents'
          # browsers and the aoe2 runner on the shared box are never touched.
          for e in $(grep -lzx "GITHUB_RUN_ID=${GITHUB_RUN_ID}" /proc/[0-9]*/environ 2>/dev/null); do
            pid=${e#/proc/}; pid=${pid%/environ}
            [ "$pid" = "$$" ] || [ "$pid" = "$PPID" ] && continue
            case "$(cat "/proc/$pid/comm" 2>/dev/null)" in Runner.*) continue ;; esac
            kill "$pid" 2>/dev/null || true
          done
          rm -rf "${RUNNER_TEMP:?}"/playwright* 2>/dev/null || true

  foh-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.foh_performance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      FOH_PERF_RUNNER_CLASS: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:front-of-house-vendor
      - run: npm run check:front-of-house-assets
      - run: npx playwright install --with-deps chromium
      - name: Measure the complete CI renderer protocol
        env:
          FRONT_OF_HOUSE_PERF_OUTPUT: ${{ runner.temp }}/foh-performance
        run: npm run perf:front-of-house -- --gpu=software
      - name: Retain synthetic calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foh-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foh-performance/*.json
          if-no-files-found: warn
          retention-days: 30

  foh-regression:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.foh_performance_gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      FOH_PERF_RUNNER_CLASS: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Select renderer or measurement changes
        id: scope
        working-directory: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/foh-changed-files"
            if grep -Eq '^(front-of-house/(.*\.mjs|lot-.*\.json|vendor/.*)|test/front-of-house-performance.*\.mjs|test/static-server\.mjs|package-lock\.json|\.github/workflows/ci\.yml)$' "$RUNNER_TEMP/foh-changed-files"; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.scope.outputs.run == 'true'
        with:
          ref: 6ed7b7c2991ef0d8ccc71fe167444f5422cd7483
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - name: Install both frozen checkouts
        if: steps.scope.outputs.run == 'true'
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate
          npm run check:front-of-house-vendor --prefix baseline
          npm run check:front-of-house-assets --prefix baseline
          npm run check:front-of-house-vendor --prefix candidate
          npm run check:front-of-house-assets --prefix candidate
          cd candidate
          npx playwright install --with-deps chromium
      - name: Measure calibrated baseline
        if: steps.scope.outputs.run == 'true'
        working-directory: baseline
        env:
          FRONT_OF_HOUSE_PERF_OUTPUT: ${{ runner.temp }}/foh-pair/baseline
        run: npm run perf:front-of-house -- --gpu=software
      - name: Measure candidate
        if: steps.scope.outputs.run == 'true'
        working-directory: candidate
        env:
          FRONT_OF_HOUSE_PERF_OUTPUT: ${{ runner.temp }}/foh-pair/candidate
        run: npm run perf:front-of-house -- --gpu=software
      - name: Audit raw evidence and enforce limits
        if: steps.scope.outputs.run == 'true'
        env:
          PAIR_ROOT: ${{ runner.temp }}/foh-pair
        run: node candidate/front-of-house/tools/performance-gate.mjs "$PAIR_ROOT/baseline" "$PAIR_ROOT/candidate" baseline candidate "$PAIR_ROOT/comparison.json"
      - name: Measure deliberate CPU regression
        if: steps.scope.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.foh_performance_fault
        working-directory: candidate
        env:
          FRONT_OF_HOUSE_PERF_OUTPUT: ${{ runner.temp }}/foh-pair/fault
        run: npm run perf:front-of-house -- --gpu=software --fault-cpu=20
      - name: Require numeric rejection of the valid fault run
        if: steps.scope.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.foh_performance_fault
        env:
          PAIR_ROOT: ${{ runner.temp }}/foh-pair
        run: node candidate/front-of-house/tools/performance-gate.mjs "$PAIR_ROOT/baseline" "$PAIR_ROOT/fault" baseline candidate "$PAIR_ROOT/fault-comparison.json" --expect-fault
      - name: Retain paired regression evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foh-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foh-pair/**/*.json
          if-no-files-found: warn
          retention-days: 30
