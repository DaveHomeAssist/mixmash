name: CI

on:
  push:
    branches: [gh-pages]
    paths:
      - 'src/**'
      - 'test/**'
      - 'play/**'
      - 'mars/**'
      - 'pitch/**'
      - 'empires/**'
      - 'garden/**'
      - 'api/**'
      - 'index.html'
      - 'home.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'offline.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run vercel-build
      - run: npm run art:validate
      - run: npm run sim
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:play
      - run: npm run smoke:catalog
