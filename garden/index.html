<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #06060E; overflow: hidden; }
/* The wrapper is one container: a slim control strip above the game, then the
   game frame filling the rest. Garden OS draws its own HUD in every corner of
   the frame (menu and chapter top-left, counters and theme top-right, Plant
   and pack bottom-left, Next bottom-right), so the shared MixKit controls sit
   outside the frame instead of floating over it. Fullscreen targets this
   container, which is sized to the whole viewport. */
#garden-stage {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  background: #06060E;
}
#garden-stage:fullscreen { width: 100vw; height: 100vh; height: 100dvh; }
.garden-bar {
  flex: 0 0 auto;
  /* viewport-fit=cover: keep the strip clear of the notch and the side insets
     (zero until the page opts in, and on devices without them). */
  --inset-top: var(--safe-top, env(safe-area-inset-top, 0px));
  height: calc(48px + var(--inset-top));
  display: flex; align-items: center;
  padding: var(--inset-top) max(8px, var(--safe-right, env(safe-area-inset-right, 0px))) 0 max(8px, var(--safe-left, env(safe-area-inset-left, 0px)));
  background: #06060E;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
/* nav.js floats its bar over the page; here it lives in the strip, so it stays
   in normal flow and open (the script tag sets data-nav-collapse="off"). */
.garden-bar .mixnav { position: static; }
#game-frame {
  flex: 1 1 auto;
  width: 100%; min-height: 0;
  border: 0; display: block;

<body>
<script src="../src/kit/nav.js" data-nav-collapse="off"></script>
<div id="garden-stage">
<div class="garden-bar"></div>
<iframe id="game-frame"
  src="https://davehomeassist.github.io/garden-os/story-mode/"
  title="Garden OS: Story Mode"
  allow="fullscreen; gamepad; autoplay"></iframe>
</div>
<script>
const frame = document.getElementById('game-frame');
const stage = document.getElementById('garden-stage');

// Cross-origin Garden OS only gets keys when the iframe element itself is
// focused. contentWindow.focus() alone is unreliable across origins; match
// home.html and call frame.focus() first.
function focusGame() {
  try { frame.focus(); } catch (e) {}
  try { if (frame.contentWindow) frame.contentWindow.focus(); } catch (e) {}
}

window.addEventListener('load', focusGame);
frame.addEventListener('load', focusGame);

// Pointer on the stage/strip (but not Hub/Mute/Fullscreen/GitHub) hands focus
// back to the game so keys work without a canvas click first.
// The browser's own mousedown default runs after pointerdown and moves focus
// from the iframe to <body> when the strip background is clicked, so focusing
// synchronously here lost. Cancel that default for non-control targets and
// defer the refocus past it (touch taps synthesize the same mousedown).
function isStripControl(target) {
  return !!(target && target.closest && target.closest('.mixnav a, .mixnav button'));
}
stage.addEventListener('mousedown', (event) => {
  if (isStripControl(event.target)) return;
  event.preventDefault();
});
stage.addEventListener('pointerdown', (event) => {
  if (isStripControl(event.target)) return;
  setTimeout(focusGame, 0);
});

// Strip controls (Mute, Fullscreen, GitHub) leave a :focus-visible ring and
// keep capturing keys (e.g. tool hotkey "2"). Blur them and return focus to
// the iframe after their click handlers run. Same-tab Hub navigates away.
function restoreFocusAfterNavClick(event) {
  const control = event.target.closest && event.target.closest('.mixnav a, .mixnav button');
  if (!control) return;
  // Same-tab Hub navigates away; leave focus alone.
  if (control.tagName === 'A' && control.getAttribute('target') !== '_blank') return;
  try { control.blur(); } catch (e) {}
  // Defer past the click and any button reflow (Mute label/aria updates) so
  // focusGame wins over the control that just received the activation focus.
  setTimeout(focusGame, 0);
}
document.addEventListener('click', restoreFocusAfterNavClick);

// Entering or leaving fullscreen leaves focus on the button or the document;
// hand it back to the game either way so keys keep reaching Garden OS.
function onFullscreenChange() { setTimeout(focusGame, 0); }
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

// Move the shared nav (src/kit/nav.js) into the strip above the game, and make
// its Fullscreen button fullscreen the whole stage (strip + game) instead of
// the document, so the game fills the screen and Exit stays reachable.
function adoptNav() {
  const nav = window.__mixmashNav && window.__mixmashNav.element;
  if (!nav) return;
  stage.querySelector('.garden-bar').appendChild(nav);
  const fsBtn = Array.from(nav.querySelectorAll('button')).find((b) => /fullscreen/i.test(b.title));
  if (!fsBtn) return;
  nav.addEventListener('click', (event) => {
    if (!fsBtn.contains(event.target)) return;
    // stopPropagation keeps nav.js from fullscreening the document instead of
    // the stage, which also skips restoreFocusAfterNavClick, so blur the button
    // and refocus the game here. Otherwise "Exit Full" keeps focus, keys never
    // reach the game, and Space/Enter would toggle fullscreen back off.
    event.stopPropagation();
    try { fsBtn.blur(); } catch (e) {}
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } else if (stage.requestFullscreen) {
      stage.requestFullscreen().catch(() => {});
    } else if (stage.webkitRequestFullscreen) {
      stage.webkitRequestFullscreen();
    }
    setTimeout(focusGame, 0);
  }, true);
}
// Mute All remembers its setting in mm.prefs ({"muteAll": true}). Restore it once
// the nav exists, then record every change the button (or setMuted) makes.
function readPrefs() {
  try {
    const prefs = JSON.parse(localStorage.getItem('mm.prefs'));
    return prefs && typeof prefs === 'object' && !Array.isArray(prefs) ? prefs : {};
  } catch (e) { return {}; }
}
function restoreMute() {
  try {
    const nav = window.__mixmashNav;
    if (!nav) return;
    const saved = readPrefs().muteAll;
    if (typeof saved === 'boolean' && nav.isMuted() !== saved) nav.setMuted(saved);
    window.addEventListener('mixmash:mute', (event) => {
      try {
        const prefs = readPrefs();
        prefs.muteAll = !!(event.detail && event.detail.muted);
        localStorage.setItem('mm.prefs', JSON.stringify(prefs));
      } catch (e) {}
    });
  } catch (e) {}
}
function initNav() { adoptNav(); restoreMute(); }
if (window.__mixmashNav) initNav();
else document.addEventListener('DOMContentLoaded', initNav, { once: true });
</script>
