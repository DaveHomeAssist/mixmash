<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Garden OS: Story Mode — MixMash Studio</title>
<meta name="description" content="A 3D open-world garden adventure by MixMash Studio. Plays free in your browser.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #06060E; overflow: hidden; }
/* The wrapper is one container: a slim control strip above the game, then the
   game frame filling the rest. Garden OS draws its own HUD in every corner of
   the frame (menu and chapter top-left, counters and theme top-right, Plant
   and pack bottom-left, Next bottom-right), so the shared MixKit controls sit
   outside the frame instead of floating over it. Fullscreen targets this
   container, which is sized to the whole viewport. */
#garden-stage {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  background: #06060E;
}
#garden-stage:fullscreen { width: 100vw; height: 100vh; height: 100dvh; }
.garden-bar {
  flex: 0 0 auto;
  /* viewport-fit=cover: keep the strip clear of the notch and the side insets
     (zero until the page opts in, and on devices without them). */
  --inset-top: var(--safe-top, env(safe-area-inset-top, 0px));
  height: calc(48px + var(--inset-top));
  display: flex; align-items: center;
  padding: var(--inset-top) max(8px, var(--safe-right, env(safe-area-inset-right, 0px))) 0 max(8px, var(--safe-left, env(safe-area-inset-left, 0px)));
  background: #06060E;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
/* nav.js floats its bar over the page; here it lives in the strip, so it stays
   in normal flow and open (the script tag sets data-nav-collapse="off"). */
.garden-bar .mixnav { position: static; }
#game-frame {
  flex: 1 1 auto;
  width: 100%; min-height: 0;
  border: 0; display: block;
}
</style>
<script src="/src/kit/pwa.js" defer></script>
</head>
<body>
<script src="../src/kit/nav.js" data-nav-collapse="off"></script>
<div id="garden-stage">
<div class="garden-bar"></div>
<iframe id="game-frame"
  src="https://davehomeassist.github.io/garden-os/story-mode/"
  title="Garden OS: Story Mode"
  allow="fullscreen; gamepad; autoplay"></iframe>
</div>
<script>
const frame = document.getElementById('game-frame');
const stage = document.getElementById('garden-stage');

// Cross-origin Garden OS only gets keys when the iframe element itself is
// focused. contentWindow.focus() alone is unreliable across origins; match
// home.html and call frame.focus() first.
function focusGame() {
  try { frame.focus(); } catch (e) {}
  try { if (frame.contentWindow) frame.contentWindow.focus(); } catch (e) {}
}

window.addEventListener('load', focusGame);
frame.addEventListener('load', focusGame);

// Pointer on the stage/strip (but not Hub/Mute/Fullscreen/GitHub) hands focus
// back to the game so keys work without a canvas click first.
stage.addEventListener('pointerdown', (event) => {
  if (event.target.closest && event.target.closest('.mixnav a, .mixnav button')) return;
  focusGame();
});

// Leaving fullscreen often leaves focus on the document; restore the game.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) focusGame();
});

// Move the shared nav (src/kit/nav.js) into the strip above the game, and make
// its Fullscreen button fullscreen the whole stage (strip + game) instead of
// the document, so the game fills the screen and Exit stays reachable.
function adoptNav() {
  const nav = window.__mixmashNav && window.__mixmashNav.element;
  if (!nav) return;
  stage.querySelector('.garden-bar').appendChild(nav);
  const fsBtn = Array.from(nav.querySelectorAll('button')).find((b) => /fullscreen/i.test(b.title));
  if (!fsBtn) return;
  nav.addEventListener('click', (event) => {
    if (!fsBtn.contains(event.target)) return;
    event.stopPropagation();
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } else if (stage.requestFullscreen) {
      stage.requestFullscreen().catch(() => {});
    } else if (stage.webkitRequestFullscreen) {
      stage.webkitRequestFullscreen();
    }
  }, true);
}
if (window.__mixmashNav) adoptNav();
else document.addEventListener('DOMContentLoaded', adoptNav, { once: true });
</script>
</body>
</html>
