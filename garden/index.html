<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden OS: Story Mode — MixMash Studio</title>
<meta name="description" content="A 3D open-world garden adventure by MixMash Studio. Plays free in your browser.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #06060E; overflow: hidden; }
#game-frame {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  border: 0; display: block;
}
</style>
<script src="/src/kit/pwa.js" defer></script>
</head>
<body>
<script src="../src/kit/nav.js"></script>
<iframe id="game-frame"
  src="https://davehomeassist.github.io/garden-os/story-mode/"
  title="Garden OS: Story Mode"
  allow="fullscreen; pointer-lock; gamepad; autoplay"
  allowfullscreen></iframe>
<script>
const frame = document.getElementById('game-frame');
window.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch(e) {} });
window.addEventListener('mousedown', () => { try { frame.contentWindow.focus(); } catch(e) {} });
// The shared nav (src/kit/nav.js) owns the idle-dim behaviour the old back pill had.
</script>
</body>
</html>
